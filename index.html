<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101827" />
    <meta name="description" content="身内で楽しむ、みんはや風の早押しクイズ" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="stylesheet" href="styles.css" />
    <title>はやおし文庫</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" id="homeButton" aria-label="ホームへ戻る">
          <span class="brand-mark">Q</span>
          <span>
            <strong>はやおし文庫</strong>
            <small>family quiz room</small>
          </span>
        </button>
        <div class="topbar-actions">
          <span class="connection-pill"><i></i><span id="connectionText">ローカルモード</span></span>
          <button class="icon-button" id="manageButton" title="問題を管理" aria-label="問題を管理">⚙</button>
        </div>
      </header>

      <main id="app" class="main-content"></main>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="modalRoot"></div>
    </div>

    <!-- PeerJS is only used when creating or joining an online room. Solo play works without it. -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="app.js" type="module"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
      }
    </script>
  </body>
</html>
